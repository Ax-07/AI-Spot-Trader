services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: ai-spot-trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_spot_trader
      POSTGRES_USER: ai_spot_trader
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ai_spot_trader_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_spot_trader -d ai_spot_trader"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_spot_trader_postgres_data: